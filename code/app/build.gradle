plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.1.0'
}

android {
    compileSdk 35

    defaultConfig {
        applicationId "com.composeweatherapp"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'  // Change this to 1.8 or a valid JVM target (1.8 is widely supported)
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.10'
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    namespace 'com.composeweatherapp'
}


dependencies {

    implementation 'androidx.multidex:multidex:2.0.1' // For AndroidX

    // Core and Compose dependencies
    implementation 'androidx.core:core-ktx:1.16.0' // updated
    implementation "androidx.compose.ui:ui:1.8.0" // updated to latest Compose
    implementation "androidx.compose.material:material:1.8.0" // updated to latest Compose
    implementation "androidx.compose.ui:ui-tooling-preview:1.8.0" // updated to latest Compose
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7' // updated
    implementation 'androidx.activity:activity-compose:1.10.1' // updated
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1' // updated
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1' // updated
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:1.8.0" // updated
    debugImplementation "androidx.compose.ui:ui-tooling:1.8.0" // updated
    debugImplementation "androidx.compose.ui:ui-test-manifest:1.8.0" // updated

    // ViewModel
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7" // updated

    // Navigation
    implementation "androidx.navigation:navigation-compose:2.8.9" // updated

    // Retrofit
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.11.0" // updated to latest Retrofit version
    implementation "com.squareup.retrofit2:adapter-rxjava2:2.9.0" // updated to latest Retrofit version

    // Dependency Injection (Dagger Hilt)
    implementation 'com.google.dagger:hilt-android:2.52'
    kapt 'com.google.dagger:hilt-compiler:2.52'

    // Location
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Room
    implementation 'androidx.room:room-ktx:2.7.1'
    kapt 'androidx.room:room-compiler:2.7.1'

    // System UI Controller - Accompanist
    implementation "com.google.accompanist:accompanist-systemuicontroller:0.24.13-rc" // updated to latest Accompanist version
}