buildscript {
    ext {
        // Updated Compose version to 1.4.0
        compose_version = '1.5.10'
    }
    dependencies {
        // Updated Hilt Gradle Plugin version
        classpath 'com.google.dagger:hilt-android-gradle-plugin:2.52' // Hilt plugin version
    }
}

plugins {
    // Updated Android Gradle Plugin version
    id 'com.android.application' version '8.6.1' apply false // updated AGP version
    id 'com.android.library' version '8.6.1' apply false // updated AGP version
    id 'org.jetbrains.kotlin.android' version '2.0.20' apply false // updated Kotlin version
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}